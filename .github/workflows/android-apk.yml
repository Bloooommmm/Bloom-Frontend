name: Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew test

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: bloom-debug-apk-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  publish-apk:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [build-apk, build-release]
    runs-on: ubuntu-latest
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: bloom-debug-apk-${{ github.sha }}
          path: release/debug

      - name: Download signed release artifact
        uses: actions/download-artifact@v4
        with:
          name: bloom-release-${{ github.sha }}
          path: release/release

      - name: Publish APK prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: Bloom Android build ${{ github.run_number }}
          prerelease: true
          make_latest: false
          generate_release_notes: true
          files: |
            release/debug/app-debug.apk
            release/release/bloom-release.apk
            release/release/android-sha1.txt

  build-release:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_UPLOAD_CERT_SHA1: ${{ secrets.ANDROID_UPLOAD_CERT_SHA1 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate signing certificate and write SHA-1
        shell: bash
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_UPLOAD_CERT_SHA1; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required GitHub Actions secret: $name"
              exit 1
            fi
          done

          keystore="$RUNNER_TEMP/bloom-release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          actual_sha1="$(keytool -list -v -keystore "$keystore" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" | awk -F': ' '/SHA1:/{print $2; exit}')"
          normalize() { printf '%s' "$1" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]'; }

          if [[ "$(normalize "$actual_sha1")" != "$(normalize "$ANDROID_UPLOAD_CERT_SHA1")" ]]; then
            echo "::error::ANDROID_UPLOAD_CERT_SHA1 does not match the configured release keystore."
            exit 1
          fi

          printf '%s\n' "$actual_sha1" > android-sha1.txt
          echo "ANDROID_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: ./gradlew assembleRelease

      - name: Stage release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-files
          cp app/build/outputs/apk/release/app-release.apk release-files/bloom-release.apk
          cp android-sha1.txt release-files/android-sha1.txt

      - name: Upload signed release artifact
        uses: actions/upload-artifact@v4
        with:
          name: bloom-release-${{ github.sha }}
          path: release-files
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary signing inputs
        if: always()
        run: rm -f "$RUNNER_TEMP/bloom-release.keystore" android-sha1.txt
